<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 기분 곡: 무드 멜로디</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-overlay"></div>
    <div class="container">
        <header>
            <h1>Mood Melody</h1>
            <p>지금 당신의 기분은 어떤가요?</p>
        </header>

        <section class="mood-selector">
            <button class="mood-btn" data-mood="happy">😊 행복해요</button>
            <button class="mood-btn" data-mood="sad">😢 슬퍼요</button>
            <button class="mood-btn" data-mood="energetic">⚡ 신나요</button>
            <button class="mood-btn" data-mood="relaxed">🌿 편안해요</button>
            <button class="mood-btn" data-mood="focused">🧠 집중할래요</button>
        </section>

        <section id="recommendation-card" class="recommendation-card hidden">
            <div class="card-content">
                <h2 id="song-title">곡 제목</h2>
                <h3 id="artist-name">아티스트</h3>
                <div class="actions">
                    <a id="listen-link" href="#" target="_blank" class="action-btn primary">지금 듣기</a>
                    <button id="next-btn" class="action-btn secondary">다른 곡 추천</button>
                </div>
            </div>
        </section>
    </div>
    <script src="main.js"></script>
</body>
</html>
